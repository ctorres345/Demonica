# Lints for the engine. Same spirit as the app's file, without Flutter.
# See docs/CODING_GUIDELINES.md in the repository root.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - directives_ordering
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_relative_imports
    - unawaited_futures

formatter:
  page_width: 100
