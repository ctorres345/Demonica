# Lints for the app. The engine has its own file in packages/fusion_core.
# See docs/CODING_GUIDELINES.md for why these rules are on.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_void_async
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_relative_imports
    - unawaited_futures
    - use_super_parameters

formatter:
  page_width: 100
