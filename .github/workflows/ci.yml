name: CI

# Runs only on demand: the repository is on the free GitHub tier, so the
# checks are run locally before each push (see RUNBOOK.md).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: dart test
        working-directory: packages/fusion_core
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
